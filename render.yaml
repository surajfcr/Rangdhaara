# Render Blueprint — see README.md "Deploying to Render" for the full walkthrough.
# Render reads this automatically when you create a Blueprint from this repo.
#
# IMPORTANT: every `value:` below is re-applied to the live service each time this file is
# pushed, overwriting whatever the dashboard says. A setting changed in the dashboard must be
# changed here too, or the next push silently reverts it. Anything the dashboard alone should
# own — secrets, and settings changed as the studio grows — is marked `sync: false` instead,
# which leaves the live value alone and keeps it out of git.
services:
  - type: web
    name: rangdhaara
    env: python
    plan: starter          # cheapest plan that supports a persistent disk
    region: singapore      # closest Render region to India
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py serve --forwarded-allow-ips=*
    healthCheckPath: /
    disk:
      name: rangdhaara-data
      mountPath: /var/data
      sizeGB: 1             # increase later if course videos fill it up
    envVars:
      - key: APP_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PUBLIC_BASE_URL
        value: https://rangdhara.in
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /var/data/data
      # Without this, the database would sit outside /var/data and be wiped on every future
      # deploy (only the disk survives a redeploy; everything else is rebuilt from git).
      - key: DATABASE_PATH
        value: /var/data/data/rangdhara.db
      - key: STORAGE_DIR
        value: /var/data/storage
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: STORE_NAME
        value: Rangdhara Art Studio
      # Set this only once there's a number meant for customers — the site publishes it.
      # Empty means every WhatsApp link, button and email line is left out.
      - key: SUPPORT_WHATSAPP_NUMBER
        value: ""
      - key: INSTAGRAM_HANDLE
        value: rangdhaara_
      - key: ORIGIN_PINCODE
        value: "431001"
      # Payments run through Razorpay: payment confirms itself, stock drops and the emails go
      # out with no one watching a bank statement. manual_upi is the fallback for a studio
      # without a gateway account — swapping back means setting UPI_VPA and nothing else.
      - key: PAYMENT_PROVIDER
        value: razorpay
      # Live keys and the webhook secret from the Razorpay dashboard. Declared so a blueprint
      # sync leaves them alone; the values only ever exist in Render's own settings.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: UPI_VPA
        sync: false
      - key: UPI_PAYEE_NAME
        value: Rangdhara Art Studio
      # Email: an address at your own domain (Google Workspace), used to send OTPs, receipts,
      # shipping updates, etc. An "app password" (not the mailbox's normal login password) — see README.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: STORE_ADMIN_EMAIL
        sync: false
